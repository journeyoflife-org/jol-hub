# Estonia-Specific Compliance Configuration
# GDPR Compliance for JOL-HUB Estonia Operations
# Reference: GDPR (EU) 2016/679, Estonian Personal Data Protection Act

country_code: "ee"
country_name: "Republic of Estonia"
eu_member: true
eea_member: true

# Data Protection Authority
dpa:
  name: "Andmekaitse Inspektsioon"
  name_en: "Estonian Data Protection Inspectorate"
  short: "AKI"
  website: "https://www.aki.ee"
  email: "info@aki.ee"
  address: "Väike-Paala 3, 11415 Tallinn"

# National Legal Framework
legal_framework:
  - name: "Isikuandmete kaitse seadus"
    name_en: "Personal Data Protection Act of the Republic of Estonia"
    reference: "RT I 2007, 24, 127"
    effective_date: "2008-01-01"
    last_amended: "2023-01-01"
  - name: "Avaliku teabe seadus"
    name_en: "Public Information Act of the Republic of Estonia"
    reference: "RT I 2000, 92, 597"
    notes: "Applies to public sector and media activities"

# GDPR Implementation Specifics
gdpr_implementation:
  # Article 6 - Lawful Basis
  lawful_basis:
    consent:
      min_age: 13  # Estonia standard age of consent for data processing
      parental_consent_required_below: 13
      consent_validity_months: 24
    legitimate_interest:
      documentation_required: true
      lia_template_required: true  # Legitimate Interest Assessment
    public_interest:
      includes_religious_organizations: true
      canon_law_compliance: true

  # Article 9 - Special Categories
  special_categories:
    religious_data:
      explicitly_permitted: true
      legal_basis: "Art. 9(2)(d) - Processing in course of legitimate activities"
      additional_safeguards:
        - "Canon Law compliance verification"
        - "Encryption at rest (AES-256)"
        - "Access control (4-tier RBAC)"
        - "Audit logging (immutable)"
    health_data:
      # For funeral services and cemetery records
      permitted_for:
        - "funeral_services"
        - "cemetery_records"
      retention_period_years: 75
      encryption_required: true

  # Article 17 - Right to Erasure
  right_to_erasure:
    canonical_records_exception: true
    sacramental_records:
      baptism: "permanent_retention"
      confirmation: "permanent_retention"
      marriage: "permanent_retention"
      death: "permanent_retention"
      canonical_reason: "Canon 535 §1-5 - Parish registers must be preserved"
    exception_reference: "GDPR Art. 17(3)(d)"

  # Article 30 - Records of Processing Activities
  records_of_processing:
    required: true
    template: "docs/compliance/ropa-ee-template.yml"
    review_cycle_months: 12

  # Article 44 - Data Transfers
  data_transfers:
    restricted_destinations:
      - "us"  # United States (unless SCCs with supplementary measures)
      - "ru"  # Russia
      - "by"  # Belarus
      - "cn"  # China
    permitted_destinations:
      - "at"  # Austria
      - "be"  # Belgium
      - "bg"  # Bulgaria
      - "cy"  # Cyprus
      - "cz"  # Czech Republic
      - "de"  # Germany
      - "dk"  # Denmark
      - "ee"  # Estonia
      - "es"  # Spain
      - "fi"  # Finland
      - "fr"  # France
      - "gr"  # Greece
      - "hr"  # Croatia
      - "hu"  # Hungary
      - "ie"  # Ireland
      - "it"  # Italy
      - "lt"  # Lithuania
      - "lv"  # Latvia
      - "mt"  # Malta
      - "nl"  # Netherlands
      - "pl"  # Poland
      - "pt"  # Portugal
      - "ro"  # Romania
      - "se"  # Sweden
      - "si"  # Slovenia
      - "sk"  # Slovakia
      - "va"  # Vatican City State

# Consent Requirements
consent:
  cookie_consent:
    law: "2002/58/EC (ePrivacy Directive) as transposed"
    strict_necessary_exemption: true
    analytics_opt_in: true
    marketing_opt_in: true
    consent_banner_language: "et"
    consent_version: "1.0"

  # Consent text templates (Estonian)
  consent_texts:
    cookie_banner:
      et: "Kasutame küpsiseid, et tagada veebisaidi nõuetekohane toimimine. Edasi sirvides nõustute meie küpsistepoliitikaga."
      en: "We use cookies to ensure proper website functionality. By continuing to browse, you agree to our cookie policy."
      ru: "Мы используем файлы cookie для обеспечения правильной работы сайта. Продолжая просмотр, вы соглашаетесь с нашей политикой cookie."
    privacy_notice:
      et: "Teie isikuandmeid töödeldakse GDPR-i kohaselt."
      en: "Your personal data will be processed in accordance with GDPR."

# Data Retention
retention_periods:
  sacramental_records: "permanent"  # Canon Law requirement
  parishioner_records: 10  # years after last contact
  donation_records: 7  # years (tax law requirement)
  financial_records: 10  # years (Estonian tax law)
  funeral_service_records: 75  # years
  cemetery_records: 75  # years
  website_analytics: 26  # months (GDPR best practice)
  email_marketing: 36  # months
  consent_records: 36  # months

# Data Subject Rights
data_subject_rights:
  access_request:
    response_deadline_days: 30
    max_extension_days: 60
    fee_allowed: false
  rectification:
    canonical_records_limitation: true
  erasure:
    canonical_exception: true
  portability:
    format: "JSON, XML"
  objection:
    direct_marketing_opt_out: true

# Breach Notification
breach_notification:
  authority_notification_hours: 72
  data_subject_notification:
    required: true
    threshold: "high_risk"
  contact: "security@elu-tee.ee"

# Children's Data
children:
  age_of_consent: 13
  parental_verification_required: true
  verification_method:
    - "email_confirmation"
    - "id_verification"

# Religious Organizations Specific
religious_organizations:
  canonical_compliance:
    canon_law_reference: "1983 Code of Canon Law"
    relevant_canons:
      - "Canon 220 - Right to good reputation"
      - "Canon 223 §2 - Limitations on rights for public order"
      - "Canon 535 §1-5 - Parish registers"
      - "Canon 540 §5 - Parish records retention"
    vatican_guidelines:
      - "Pontifical Council for Social Communications (2002)"
      - "The Church and Internet (2002)"

# Orthodox Church Specific (significant in Estonia)
orthodox_church:
  jurisdiction: "Estonian Orthodox Church"
  jurisdictions:
    - name: "Estonian Apostolic Orthodox Church (EAOC)"
      patriarchate: "Constantinople"
      canonical_status: "Autonomous"
    - name: "Estonian Orthodox Church of Moscow Patriarchate"
      patriarchate: "Moscow"
      canonical_status: "Diocese"
  calendar: "julian"
  compliance_notes:
    - "Byzantine canon law for sacramental records"
    - "Separate records retention policy"

# Lutheran Church Specific (majority historical)
lutheran_church:
  jurisdiction: "Estonian Evangelical Lutheran Church"
  governance: "Synodal"
  historical_note: "Majority church before Soviet occupation"
  compliance_notes:
    - "Lutheran church records retention"
    - "Civil registration partnership"

# Catholic Church Specific (small but significant)
catholic_church:
  jurisdiction: "Estonian Apostolic Administration"
  type: "apostolic_administration"
  cathedral: "St. Peter and St. Paul Cathedral, Tallinn"
  canonical_status: "Directly subject to Holy See"

# Audit Requirements
audit:
  internal_audit_frequency_months: 12
  external_audit_required: true
  external_audit_frequency_years: 2
  standards:
    - "ISO 27001"
    - "SOC 2 Type II"
    - "GDPR compliance audit"

# X-Road Integration (Estonian digital infrastructure)
x_road:
  enabled: false  # Not used for religious data, but available for parishioner services
  notes: "Estonia's X-Road infrastructure for secure data exchange"
  potential_use_cases:
    - "Civil registration verification"
    - "Official document signing"
