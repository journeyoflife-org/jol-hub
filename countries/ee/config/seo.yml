# EE SEO configuration — elu-tee.ee
# Governing: docs/seo/international-seo-strategy.md §2.2, §3.2

country_code: ee
domain: elu-tee.ee
default_locale: et

# hreflang alternates emitted per page
alternates:
  - locale: et-EE
    label: Eesti
  - locale: en-EE
    label: English
  - locale: ru-EE
    label: Русский

# x-default points to the national language
x_default: et-EE

# IndexNow API key (per-tenant, stored in spoke secrets)
index_now:
  enabled: true
  key_location: "secrets/encrypted/common/index-now-key.enc"

# Sitemap
sitemap:
  enabled: true
  per_tenant: true
  max_urls_per_file: 50000

# Robots
robots:
  noindex: true  # REMOVE after owner authorizes per-spoke go-live
  disallow:
    - /api/
    - /admin/
    - /_next/
    - /secrets/
