        time: "18:00"
        type: "vespers"
        
  # Compliance
  compliance:
    gdpr: true
    dpa: "Andmekaitse Inspektsioon"
    
  # Statistics
  statistics:
    members_estimate: 5000
    founded: "1233"
    
  # Integrations
  integrations:
    bitrix24:
      portal: "elu-tee.bitrix24.ee"
      sync_contacts: true
      sync_donations: true
      
  # Audit
  audit:
    created_at: "2026-04-06T00:00:00Z"
