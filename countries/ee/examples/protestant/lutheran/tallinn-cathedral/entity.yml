  type: "protestant"
  name: "Tallinna Toomkirik"
  name_en: "Tallinn Cathedral (St. Mary's Lutheran)"
  country: "ee"
  
  # Canonical information
  canonical:
    jurisdiction: "Estonian Evangelical Lutheran Church"
    type: "cathedral"
    dedication: "St. Mary"
    calendar: "gregorian"
    
  # Contact information
  contact:
    address: "Toom-Kooli 6, 10130 Tallinn, Eesti"
    phone: "+372 644 4180"
    email: "toomkirik@eelk.ee"
    website: "https://elu-tee.ee/tallinn-cathedral"
    
  # Hierarchy
  hierarchy:
    level: 2
    parent_jurisdiction: "estonian-evangelical-lutheran-church"
    
  # Localization
  languages:
