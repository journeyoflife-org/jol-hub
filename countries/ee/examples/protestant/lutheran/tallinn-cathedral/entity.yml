    supported: ["et", "en", "de"]
    
  # Domain configuration
  domain:
    primary: "tallinn-cathedral.elu-tee.ee"
    aliases:
      - "toomkirik.elu-tee.ee"
    
  # Features enabled
  features:
    - "services"
    - "community"
    - "events"
    - "donations"
    - "concerts"
    
  # Service schedule
  schedule:
