# Lithuania Payment Providers Configuration
# PCI-DSS Compliant Payment Processing for JOL-HUB Lithuania

country_code: "lt"
currency: "EUR"
currency_symbol: "€"

# Primary Payment Processors
payment_providers:
  # Stripe - Primary international processor
  stripe:
    enabled: true
    supported_methods:
      - "card"  # Visa, Mastercard, Maestro
      - "sepa_debit"
      - "bancontact"
      - "ideal"  # For cross-border EU donations
    pci_compliance_level: "level_1"
    sca_compliant: true  # Strong Customer Authentication (PSD2)
    webhook_events:
      - "payment_intent.succeeded"
      - "payment_intent.payment_failed"
      - "charge.refunded"
      - "customer.subscription.created"
    compliance:
      gdpr_dpa: true
      data_residency: "EU"
      processor_agreement: "Stripe Services Agreement - EU"

  # PayPal - Secondary processor
  paypal:
    enabled: true
    supported_methods:
      - "paypal"
      - "card"
      - "sepa"
    pci_compliance_level: "level_1"
    sca_compliant: true
    compliance:
      gdpr_dpa: true
      data_residency: "EU"
      processor_agreement: "PayPal EU Seller Agreement"

  # Local Lithuanian Banks
  local_banks:
    # Swedbank Lithuania
    swedbank:
      enabled: true
      type: "bank_link"
      supported_methods:
        - "bank_link"
      api_url: "https://www.swedbank.lt/banklink"
      certification: "Lithuanian Bank Link Certification"
      compliance:
        gdpr_dpa: true
        local_bank_regulations: true

    # SEB Lithuania
    seb:
      enabled: true
      type: "bank_link"
      supported_methods:
        - "bank_link"
      api_url: "https://www.seb.lt/banklink"
      certification: "Lithuanian Bank Link Certification"
      compliance:
        gdpr_dpa: true
        local_bank_regulations: true

    # Luminor (formerly DNB/Nordea)
    luminor:
      enabled: true
      type: "bank_link"
      supported_methods:
        - "bank_link"
      api_url: "https://www.luminor.lt/banklink"
      certification: "Lithuanian Bank Link Certification"
      compliance:
        gdpr_dpa: true
        local_bank_regulations: true

    # Medicinos Bankas (smaller, specialized)
    medicinos_bankas:
      enabled: true
      type: "bank_link"
      supported_methods:
        - "bank_link"
      api_url: "https://www.medbank.lt/banklink"
      compliance:
        gdpr_dpa: true

# Mobile Payment Solutions
mobile_payments:
  # Apple Pay
  apple_pay:
    enabled: true
    supported_countries:
      - "lt"
    merchant_certification_required: true
    processor: "stripe"

  # Google Pay
  google_pay:
    enabled: true
    supported_countries:
      - "lt"
    merchant_certification_required: true
    processor: "stripe"

# Payment Methods by Entity Type
entity_payment_config:
  # Religious institutions
  basilica:
    primary_provider: "stripe"
    secondary_provider: "paypal"
    bank_link_enabled: true
    recurring_donations: true
    suggested_amounts:
      - 5
      - 10
      - 20
      - 50
      - 100

  cathedral:
    primary_provider: "stripe"
    secondary_provider: "paypal"
    bank_link_enabled: true
    recurring_donations: true
    suggested_amounts:
      - 5
      - 10
      - 20
      - 50
      - 100

  diocese:
    primary_provider: "stripe"
    secondary_provider: "paypal"
    bank_link_enabled: true
    recurring_donations: true
    multi_parish_support: true
    suggested_amounts:
      - 10
      - 25
      - 50
      - 100
      - 200

  deanery:
    primary_provider: "stripe"
    bank_link_enabled: true
    recurring_donations: true

  church:
    primary_provider: "stripe"
    secondary_provider: "paypal"
    bank_link_enabled: true
    recurring_donations: true
    suggested_amounts:
      - 2
      - 5
      - 10
      - 20
      - 50

  protestant_church:
    primary_provider: "stripe"
    secondary_provider: "paypal"
    bank_link_enabled: true
    recurring_donations: true

  orthodox_church:
    primary_provider: "stripe"
    secondary_provider: "paypal"
    bank_link_enabled: true
    recurring_donations: true

  other_christian:
    primary_provider: "stripe"
    bank_link_enabled: true
    recurring_donations: true

  # Commercial services
  funeral_home:
    primary_provider: "stripe"
    secondary_provider: "paypal"
    bank_link_enabled: true
    payment_plans: true
    pre_need_contracts: true
    pci_dss_level: "level_2"  # Higher compliance for commercial
    suggested_amounts:
      - 50
      - 100
      - 250
      - 500
      - 1000

  cemetery_service:
    primary_provider: "stripe"
    secondary_provider: "paypal"
    bank_link_enabled: true
    payment_plans: true
    subscription_services: true  # Maintenance contracts
    pci_dss_level: "level_2"
    suggested_amounts:
      - 20
      - 50
      - 100
      - 250
      - 500

# Recurring Payment Configuration
recurring_payments:
  intervals:
    - "weekly"
    - "monthly"
    - "quarterly"
    - "yearly"
  processing_day: 1  # First of the month
  retry_attempts: 3
  retry_interval_days: 7
  grace_period_days: 14

# Invoice and Receipt Settings
invoicing:
  invoice_required:
    - "funeral_home"
    - "cemetery_service"
  donation_receipt:
    enabled: true
    tax_deductible: true
    annual_summary: true
    template: "lt/donation_receipt"
  language: "lt"

# PCI-DSS Compliance
pci_dss:
  merchant_level: "level_2"  # Based on transaction volume
  requirements:
    - "SAQ A"  # For Stripe/PayPal hosted checkout
    - "SAQ A-EP"  # If using embedded fields
  quarterly_scan_required: true
  annual_self_assessment: true
  penetration_testing: true

# PSD2 / SCA Compliance
psd2:
  strong_customer_authentication: true
  exemptions:
    - "low_value"  # Transactions under €30
    - "transaction_risk_analysis"
    - "recurring_payment"
  max_exempted_transactions: 5
  max_exempted_total: 100  # EUR

# Tax Configuration
tax:
  vat:
    enabled: false  # Religious donations typically exempt
    religious_services_exempt: true
    commercial_services_rate: 21  # Lithuanian VAT rate
    applicable_to:
      - "funeral_home"
      - "cemetery_service"
  gift_aid:
    enabled: false  # UK-specific, not applicable to Lithuania
  tax_deductible_donations:
    enabled: true
    max_percentage_of_income: 20  # Lithuanian tax law
    annual_declaration_required: true

# Audit Trail Requirements
audit:
  transaction_retention_years: 10
  log_all_transactions: true
  include_card_last_four: true
  masked_card_data: true
  gdpr_consent_record: true
