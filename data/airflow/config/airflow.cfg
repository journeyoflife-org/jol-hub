[core]
dags_folder = /opt/jol/repos/jol-hub/data/airflow/dags
plugins_folder = /opt/jol/repos/jol-hub/data/airflow/plugins
base_log_folder = /var/log/jol-hub/airflow

# GDPR: Enable audit logging
dag_processor_log_timeout = 30
task_log_reader = file

[database]
sql_alchemy_conn = postgresql://jolhub:jolhub@localhost:5432/jolhub_airflow

[webserver]
web_server_host = 0.0.0.0
web_server_port = 8080
workers = 2

[logging]
# GDPR: Log masking for PII
logging_level = INFO
mask_sensitive_data = True

[scheduler]
dag_dir_list_interval = 30
