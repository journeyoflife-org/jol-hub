apiVersion: v1
kind: Secret
metadata:
  name: jol-hub-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jol-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "{{ randAlphaNum 64 }}"
  DB_USER: "{{ .Values.postgresql.auth.username }}"
  DB_PASSWORD: "{{ .Values.postgresql.auth.password }}"
  REDIS_PASSWORD: ""
  # Card-processor (PSP) keys purged STEP 18 (Model A / ADR-0005).
  PAYPAL_CLIENT_ID: ""
  PAYPAL_CLIENT_SECRET: ""
  BITRIX_CLIENT_ID: ""
  BITRIX_CLIENT_SECRET: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  SENTRY_DSN: ""
  MFA_TOTP_ISSUER_NAME: "JourneyOfLife Hub"
  NEXTAUTH_SECRET: "{{ randAlphaNum 32 }}"
