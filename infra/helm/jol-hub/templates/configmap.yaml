apiVersion: v1
kind: ConfigMap
metadata:
  name: jol-hub-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jol-hub.labels" . | nindent 4 }}
data:
  DJANGO_SETTINGS_MODULE: "core.settings.production"
  DJANGO_ALLOWED_HOSTS: "{{ .Values.app.apiDomain }}"
  CORS_ALLOWED_ORIGINS: "https://{{ .Values.app.domain }}"
  DB_HOST: "{{ .Values.postgresql.auth.username }}-service"
  DB_PORT: "5432"
  DB_NAME: "{{ .Values.postgresql.auth.database }}"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/1"
  GDPR_COOKIE_DOMAIN: ".{{ .Values.app.domain }}"
  GDPR_SECURE_COOKIE: "true"
  EMAIL_HOST: "email-smtp.eu-west-1.amazonaws.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "true"
  ENABLE_GDPR_BANNER: "true"
  ENABLE_ANALYTICS: "true"
  ENABLE_MFA: "true"
