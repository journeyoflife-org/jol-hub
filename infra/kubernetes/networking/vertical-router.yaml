# -----------------------------------------------------------------------------
# JOL Vertical Router — 10-Spoke Ingress Configuration
# -----------------------------------------------------------------------------
# Maps: Host → tenant → vertical → spoke
# Cache key: (tenant, locale, template)
# TLS 1.3 only; self-hosted or EU-jurisdiction caching only
#
# Domain topology (D-006/D-051):
#   LT: {tenant-slug}.gyvenimo-kelias.lt
#   LV: {tenant-slug}.dzives-cels.lv
#   EE: {tenant-slug}.elu-tee.ee
#   Hub: jol-hub.com (brand/marketplace only, never tenant content)
#
# Vertical mapping:
#   basilica    → jol-site-basilica
#   cathedral   → jol-site-cathedral
#   diocese     → jol-site-diocese
#   deanery     → jol-site-deanery
#   parish      → jol-site-parish
#   funeral     → jol-site-funeral
#   cemetery    → jol-site-cemetery-care
#   protestant  → jol-site-protestant
#   orthodox    → jol-site-orthodox
#   other       → jol-site-other-church
# -----------------------------------------------------------------------------

# --- LT wildcard ingress (gyvenimo-kelias.lt) ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jol-lt-wildcard-ingress
  namespace: jol-spokes
  labels:
    app.kubernetes.io/name: jol-vertical-router
    app.kubernetes.io/component: ingress
    jol.country: lt
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Cache key: (tenant via host, locale via path prefix, template via vertical header)
    nginx.ingress.kubernetes.io/proxy-cache-key: "$host$request_uri$http_x_vertical"
    nginx.ingress.kubernetes.io/proxy-cache-duration: "10m"
    nginx.ingress.kubernetes.io/proxy-cache-valid: "200=10m 404=1m"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Robots-Tag "noindex" always;  # REMOVE after Vilnius mandate resolved
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
spec:
  tls:
    - hosts:
        - "*.gyvenimo-kelias.lt"
      secretName: lt-wildcard-tls
  rules:
    - host: "*.gyvenimo-kelias.lt"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vertical-router-service
                port:
                  number: 3000
---
