---
# --- Vertical Router Service ---
# Resolves: Host header → tenant slug → vertical → spoke deployment
# The router reads X-Forwarded-Host (or Host) to resolve tenant,
# then routes to the correct spoke deployment by vertical label.
apiVersion: v1
kind: Service
metadata:
  name: vertical-router-service
  namespace: jol-spokes
  labels:
    app.kubernetes.io/name: jol-vertical-router
    app.kubernetes.io/component: router
spec:
  selector:
    app.kubernetes.io/name: jol-vertical-router
    app.kubernetes.io/component: router
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
---
# --- Spoke Deployments (one per vertical) ---
# Each spoke deployment is labeled with jol.vertical for router targeting.
# Template shown for basilica; replicate for remaining 9 verticals.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jol-site-basilica
  namespace: jol-spokes
  labels:
    app.kubernetes.io/name: jol-site-basilica
    app.kubernetes.io/component: spoke
    jol.vertical: basilica
    jol.country: lt
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jol-site-basilica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jol-site-basilica
        jol.vertical: basilica
    spec:
      containers:
        - name: next
          image: ghcr.io/journeyoflife-org/jol-site-basilica:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_TENANT_SLUG
              value: "basilica-vilnius-cathedral"
            - name: NEXT_PUBLIC_VERTICAL
              value: "basilica"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
