# -----------------------------------------------------------------------------
# JOL-HUB Frontend Deployment (Next.js)
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: jol-hub
  labels:
    app.kubernetes.io/name: jol-hub
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jol-hub
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jol-hub
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: jol-hub-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: frontend
          image: jol-hub/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.jol-hub.eu/api/v1"
            - name: NEXTAUTH_URL
              value: "https://jol-hub.eu"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: jol-hub-secrets
                  key: NEXTAUTH_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: jol-hub
                    app.kubernetes.io/component: frontend
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: jol-hub
  labels:
    app.kubernetes.io/name: jol-hub
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: jol-hub
    app.kubernetes.io/component: frontend
---
# Admin Dashboard Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dashboard
  namespace: jol-hub
  labels:
    app.kubernetes.io/name: jol-hub
    app.kubernetes.io/component: admin-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jol-hub
      app.kubernetes.io/component: admin-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jol-hub
        app.kubernetes.io/component: admin-dashboard
    spec:
      serviceAccountName: jol-hub-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: admin-dashboard
          image: jol-hub/admin-dashboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.jol-hub.eu/api/v1"
            - name: NEXTAUTH_URL
              value: "https://admin.jol-hub.eu"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: jol-hub-secrets
                  key: NEXTAUTH_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin-dashboard-service
  namespace: jol-hub
  labels:
    app.kubernetes.io/name: jol-hub
    app.kubernetes.io/component: admin-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: jol-hub
    app.kubernetes.io/component: admin-dashboard
