# -----------------------------------------------------------------------------
# JOL-HUB Kubernetes ConfigMaps
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: jol-hub-config
  namespace: jol-hub
  labels:
    app.kubernetes.io/name: jol-hub
    app.kubernetes.io/component: config
data:
  # Application Settings
  DJANGO_SETTINGS_MODULE: "core.settings.production"
  DJANGO_ALLOWED_HOSTS: "api.jol-hub.eu,api.journeyoflife.org"
  CORS_ALLOWED_ORIGINS: "https://jol-hub.eu,https://journeyoflife.org,https://admin.jol-hub.eu"
  CSRF_TRUSTED_ORIGINS: "https://jol-hub.eu,https://journeyoflife.org,https://admin.jol-hub.eu"
  
  # Database Settings
  DB_HOST: "postgres-service.jol-hub.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "jolhub"
  
  # Redis Settings
  REDIS_HOST: "redis-service.jol-hub.svc.cluster.local"
  REDIS_PORT: "6379"
  
  # Celery Settings
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/1"
  
  # GDPR Settings
  GDPR_COOKIE_DOMAIN: ".jol-hub.eu"
  GDPR_SECURE_COOKIE: "true"
  
  # Email Settings
  EMAIL_HOST: "email-smtp.eu-west-1.amazonaws.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "true"
  DEFAULT_FROM_EMAIL: "noreply@journeyoflife.org"
  
  # Feature Flags
  ENABLE_GDPR_BANNER: "true"
  ENABLE_ANALYTICS: "true"
  ENABLE_MFA: "true"
  
  # Rate Limiting
  RATELIMIT_ENABLE: "true"
  RATELIMIT_RATE: "100/m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: jol-hub
  labels:
    app.kubernetes.io/name: jol-hub
    app.kubernetes.io/component: nginx
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    
    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';
        
        access_log /var/log/nginx/access.log main;
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        
        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        
        # Gzip Compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
        
        # Rate Limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
        
        # Upstream Backend
        upstream backend {
            least_conn;
            server backend-service:8000;
            keepalive 32;
        }
        
        # HTTP Redirect
        server {
            listen 80;
            server_name jol-hub.eu www.jol-hub.eu;
            return 301 https://$server_name$request_uri;
        }
        
        # HTTPS Server
        server {
            listen 443 ssl http2;
            server_name jol-hub.eu www.jol-hub.eu;
            
            ssl_certificate /etc/nginx/tls/tls.crt;
            ssl_certificate_key /etc/nginx/tls/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
            ssl_prefer_server_ciphers off;
            ssl_session_cache shared:SSL:10m;
            ssl_session_timeout 1d;
            
            # HSTS
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            
            # CSP
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.jol-hub.eu; frame-ancestors 'none';" always;
            
            # Static Files
            location /static/ {
                alias /app/static/;
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
            
            # Media Files
            location /media/ {
                alias /app/media/;
                expires 7d;
                add_header Cache-Control "public";
            }
            
            # Health Check
            location /health {
                access_log off;
                return 200 "OK";
                add_header Content-Type text/plain;
            }
            
            # API Proxy
            location /api/ {
                limit_req zone=api burst=20 nodelay;
                proxy_pass http://backend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Connection "";
                proxy_connect_timeout 30s;
                proxy_read_timeout 60s;
            }
            
            # Admin Login Rate Limit
            location /admin/login/ {
                limit_req zone=login burst=5 nodelay;
                proxy_pass http://backend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Default
            location / {
                proxy_pass http://backend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Connection "";
            }
        }
    }
