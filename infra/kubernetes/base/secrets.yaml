# -----------------------------------------------------------------------------
# JOL-HUB Kubernetes Secrets (Template - Use External Secrets Operator)
# -----------------------------------------------------------------------------
# NOTE: In production, use External Secrets Operator or Sealed Secrets
# This is a template for reference only
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: jol-hub-secrets
  namespace: jol-hub
  labels:
    app.kubernetes.io/name: jol-hub
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Django Settings
  DJANGO_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_KMS_OR_SECRETS_MANAGER"
  
  # Database Credentials
  DB_USER: "jolhub"
  DB_PASSWORD: "CHANGE_ME_USE_AWS_SECRETS_MANAGER"
  
  # Redis Password (if authentication enabled)
  REDIS_PASSWORD: ""
  
  # Stripe Keys
  STRIPE_PUBLISHABLE_KEY: "pk_live_CHANGE_ME"
  STRIPE_SECRET_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"
  
  # PayPal Credentials
  PAYPAL_CLIENT_ID: "CHANGE_ME"
  PAYPAL_CLIENT_SECRET: "CHANGE_ME"
  
  # Bitrix24 OAuth
  BITRIX_CLIENT_ID: "CHANGE_ME"
  BITRIX_CLIENT_SECRET: "CHANGE_ME"
  
  # Email Credentials
  EMAIL_HOST_USER: "AKIAIOSFODNN7EXAMPLE"
  EMAIL_HOST_PASSWORD: "CHANGE_ME"
  
  # Sentry DSN
  SENTRY_DSN: "https://key@sentry.io/project"
  
  # MFA Settings
  MFA_TOTP_ISSUER_NAME: "JourneyOfLife Hub"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: jol-hub
  labels:
    app.kubernetes.io/name: jol-hub
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_DB: "jolhub"
  POSTGRES_USER: "jolhub"
  POSTGRES_PASSWORD: "CHANGE_ME_USE_AWS_SECRETS_MANAGER"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: jol-hub
  labels:
    app.kubernetes.io/name: jol-hub
    app.kubernetes.io/component: redis
type: Opaque
stringData:
  REDIS_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: jol-hub
  labels:
    app.kubernetes.io/name: jol-hub
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  # Base64 encoded TLS certificate and key
  # In production, use cert-manager for automatic certificate management
  tls.crt: ""
  tls.key: ""
