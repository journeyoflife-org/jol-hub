# =============================================================================
# JOL-HUB Security Scanning Pipeline
# =============================================================================
# Runs security scans: SAST, SCA, Container Scanning, Secret Detection
# Scheduled daily + on push to main/develop
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  PNPM_VERSION: '10.30.3'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # ===========================================================================
  # SECRET SCANNING
  # ===========================================================================
  
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # Full history for better detection
      
      - name: Run Gitleaks (CLI)
        run: |
          # Use free gitleaks CLI instead of paid GitHub Action
          # The gitleaks-action requires a license for organizations
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --verbose --no-git --exit-code 1 || true
          # TruffleHog (below) provides the primary secret detection
        continue-on-error: true
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@288a8a8643a2c5a36b81d231c550dccfa0beeb64  # main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ===========================================================================
  # SAST - Static Application Security Testing
  # ===========================================================================
  
  sast-backend:
    name: SAST - Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/django
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Bandit
        run: pip install bandit
      
      - name: Run Bandit
        run: |
          bandit -r . -f json -o bandit-report.json -f sarif -o bandit.sarif.json || true
          bandit -r . -ll -iii  # Only show medium/high severity
      
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
            p/django
            p/owasp-top-ten
        continue-on-error: true
      
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3
        if: always()
        with:
          sarif_file: backend/django/bandit.sarif.json
          category: bandit
        continue-on-error: true

  sast-frontend:
    name: SAST - Frontend (TypeScript/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/typescript
            p/react
            p/nextjs
            p/owasp-top-ten
        continue-on-error: true

  # ===========================================================================
  # SCA - Software Composition Analysis
  # ===========================================================================
  
  sca-backend:
    name: SCA - Backend Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/django
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Pip-audit
        run: pip install pip-audit
      
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt --format json -o pip-audit-report.json || true
          # Report vulnerabilities but don't fail the build
          # Track remediation via Dependabot PRs
          pip-audit -r requirements.txt || echo "Vulnerabilities found — track remediation via Dependabot"
      
      - name: Generate SCA summary
        run: |
          echo "### Backend SCA Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f pip-audit-report.json ]; then
            VULN_COUNT=$(python -c "import json; data=json.load(open('pip-audit-report.json')); print(len(data.get('dependencies', [])))" 2>/dev/null || echo "unknown")
            echo "Scanned requirements.txt — \${VULN_COUNT} package(s) with known vulnerabilities" >> $GITHUB_STEP_SUMMARY
            echo "Remediation: review Dependabot PRs for version bumps" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload SCA results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: backend-sca-reports
          path: |
            backend/django/safety-report.json
            backend/django/pip-audit-report.json
          retention-days: 30

  sca-frontend:
    name: SCA - Frontend Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run pnpm audit
        run: |
          pnpm audit --json > pnpm-audit-report.json || true
          # Report vulnerabilities but don't fail the build
          # Track remediation via Dependabot PRs
          pnpm audit || echo "Vulnerabilities found — track remediation via Dependabot"
      
      - name: Generate frontend SCA summary
        run: |
          echo "### Frontend SCA Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f pnpm-audit-report.json ]; then
            echo "Scanned pnpm dependencies — review Dependabot PRs for version bumps" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Run Snyk security scan
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd  # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif
      
      - name: Upload Snyk results
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3
        if: always()
        with:
          sarif_file: frontend/snyk.sarif
          category: snyk-frontend
        continue-on-error: true

  # ===========================================================================
  # CONTAINER SCANNING
  # ===========================================================================
  
  container-scan:
    name: Container Image Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      
      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297  # master
        with:
          image-ref: '.'
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
      
      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297  # master
        with:
          image-ref: '.'
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3
        if: always()
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'
        continue-on-error: true

  # ===========================================================================
  # IAC SCANNING
  # ===========================================================================
  
  iac-scan:
    name: Infrastructure as Code Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e  # master
        with:
          directory: ./infra
          framework: terraform,dockerfile,kubernetes
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true
      
      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov
        continue-on-error: true
      
      - name: Run Terrascan
        uses: tenable/terrascan-action@a4b0f7ec5fb3c4c66b8e76d824d958002f6ce12c  # main
        with:
          iac_type: terraform
          iac_dir: ./infra/terraform
          only_warn: true

  # ===========================================================================
  # CODEQL ANALYSIS
  # ===========================================================================
  
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3
        with:
          category: "/language:${{ matrix.language }}"

  # ===========================================================================
  # SECURITY SUMMARY
  # ===========================================================================
  
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-backend, sast-frontend, sca-backend, sca-frontend, container-scan, iac-scan, codeql]
    if: always()
    
    steps:
      - name: Generate Security Summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST Backend | ${{ needs.sast-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST Frontend | ${{ needs.sast-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA Backend | ${{ needs.sca-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA Frontend | ${{ needs.sca-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| IaC Scan | ${{ needs.iac-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Review the detailed results in the Security tab." >> $GITHUB_STEP_SUMMARY
      
      - name: Check for critical findings
        run: |
          # This would normally check for critical vulnerabilities
          # and fail the build if found
          echo "Security scan completed. Review results for any critical findings."
