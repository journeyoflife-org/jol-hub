# =============================================================================
# JOL-HUB Security Scanning Pipeline
# =============================================================================
# Runs security scans: SAST, SCA, Container Scanning, Secret Detection
# Scheduled daily + on push to main/develop
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  PNPM_VERSION: '10.30.3'

jobs:
  # ===========================================================================
  # SECRET SCANNING
  # ===========================================================================
  
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for better detection
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ===========================================================================
  # SAST - Static Application Security Testing
  # ===========================================================================
  
  sast-backend:
    name: SAST - Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/django
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Bandit
        run: pip install bandit
      
      - name: Run Bandit
        run: |
          bandit -r . -f json -o bandit-report.json -f sarif -o bandit.sarif.json || true
          bandit -r . -ll -iii  # Only show medium/high severity
      
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
            p/django
            p/owasp-top-ten
        continue-on-error: true
      
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: backend/django/bandit.sarif.json
          category: bandit
        continue-on-error: true

  sast-frontend:
    name: SAST - Frontend (TypeScript/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/typescript
            p/react
            p/nextjs
            p/owasp-top-ten
        continue-on-error: true

  # ===========================================================================
  # SCA - Software Composition Analysis
  # ===========================================================================
  
  sca-backend:
    name: SCA - Backend Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/django
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Safety and Pip-audit
        run: pip install safety pip-audit
      
      - name: Run Safety check
        run: |
          safety check -r requirements.txt --json > safety-report.json || true
          safety check -r requirements.txt
      
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt --format json -o pip-audit-report.json || true
          pip-audit -r requirements.txt
      
      - name: Upload SCA results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-sca-reports
          path: |
            backend/django/safety-report.json
            backend/django/pip-audit-report.json
          retention-days: 30

  sca-frontend:
    name: SCA - Frontend Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run pnpm audit
        run: |
          pnpm audit --json > pnpm-audit-report.json || true
          pnpm audit
      
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif
      
      - name: Upload Snyk results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: frontend/snyk.sarif
          category: snyk-frontend
        continue-on-error: true

  # ===========================================================================
  # CONTAINER SCANNING
  # ===========================================================================
  
  container-scan:
    name: Container Image Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '.'
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
      
      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '.'
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'
        continue-on-error: true

  # ===========================================================================
  # IAC SCANNING
  # ===========================================================================
  
  iac-scan:
    name: Infrastructure as Code Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./infra
          framework: terraform,dockerfile,kubernetes
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true
      
      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov
        continue-on-error: true
      
      - name: Run Terrascan
        uses: tenable/terrascan-action@main
        with:
          iac_type: terraform
          iac_dir: ./infra/terraform
          only_warn: true

  # ===========================================================================
  # CODEQL ANALYSIS
  # ===========================================================================
  
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ===========================================================================
  # SECURITY SUMMARY
  # ===========================================================================
  
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-backend, sast-frontend, sca-backend, sca-frontend, container-scan, iac-scan, codeql]
    if: always()
    
    steps:
      - name: Generate Security Summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST Backend | ${{ needs.sast-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST Frontend | ${{ needs.sast-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA Backend | ${{ needs.sca-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA Frontend | ${{ needs.sca-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| IaC Scan | ${{ needs.iac-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Review the detailed results in the Security tab." >> $GITHUB_STEP_SUMMARY
      
      - name: Check for critical findings
        run: |
          # This would normally check for critical vulnerabilities
          # and fail the build if found
          echo "Security scan completed. Review results for any critical findings."
